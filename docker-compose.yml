# Pipeline + Resume Matcher (https://github.com/srbhr/resume-matcher)
#
# Setup:    Pipeline → Resume tab → copy the setup command for your OS
# From repo: ./scripts/start-resume-matcher.sh   or   docker compose up -d
# App:     http://localhost:18765  (dedicated port — avoids 3000/5000/8080 conflicts)
# Override: RESUME_MATCHER_PORT=18765 docker compose up -d
# Pipeline: open index.html via any static server, or use the command below
#
# Optional — serve Pipeline on :8080:
#   docker run --rm -p 8080:8080 -v "$PWD":/usr/share/nginx/html:ro nginx:alpine

services:
  resume-matcher:
    image: ghcr.io/srbhr/resume-matcher:latest
    container_name: pipeline-resume-matcher
    ports:
      - "${RESUME_MATCHER_PORT:-18765}:3000"
    volumes:
      - resume-matcher-data:/app/backend/data
    environment:
      # Internal URL for PDF rendering (Playwright runs inside the container).
      # Container listens on :3000 internally — FRONTEND_BASE_URL uses container port, not host.
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://127.0.0.1:3000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Allow Pipeline static dev servers to call the API (job sync)
      - CORS_ORIGINS=["http://localhost:18765","http://127.0.0.1:18765","http://localhost:8080","http://127.0.0.1:8080","http://localhost:5500","http://127.0.0.1:5500","http://localhost:5173","http://127.0.0.1:5173"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  resume-matcher-data:
